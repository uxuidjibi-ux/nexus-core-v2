[project]
name = "nexus-core-v2"
version = "2.0.0"
description = "Multi-agent product delivery orchestration with LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.60,<1.0",
  "langchain-openai>=0.3.0,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "httpx>=0.28,<1.0",
  "tenacity>=9.0,<10.0",
  "python-dotenv>=1.0,<2.0",
  "typer>=0.15,<1.0",
  "rich>=13.9,<15.0",
  "Jinja2>=3.1,<4.0",
  "Markdown>=3.7,<4.0",
  "WeasyPrint>=62.0,<69.0",
  "reportlab>=4.2,<5.0",
  "python-docx>=1.1,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_autocommerce_doc1.py" = ["E501", "S108"]
